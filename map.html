<!DOCTYPE html>
<html lang="en" class="map">
<head>
    <meta charset="UTF-8">
    <title>Карта ДТП</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" type="text/css" media="screen" href="css/style.css">
    <script src="https://mapgl.2gis.com/api/js/v1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>
<body>
 <!-- main header -->
    <header class="main-header" role="banner">
        <div class="header-inner">
            <div class="logo">
                <a href="#your_domain"><img src="image/logo_main.png" alt="main_logo" class="main_logo" style="scale: 1.4; width: 150px; display: flex; align-items: center; justify-content: center"></a>
            </div>
            <nav class="site-nav" role="navigation" aria-label="Основное меню">
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="map.html" class="active">Карта</a></li>
                    <li><a href="news.html">Новости</a></li>
                    <li><a href="#">Аналитика</a></li>
                    <li><a href="documents.html">Документы</a></li>
                    <li><a href="#">О центре</a></li>
                </ul>
            </nav>
            <a class="cta" href="https://pos.gosuslugi.ru/form/?opaId=222162&utm_source=vk&utm_medium=66&utm_campaign=1086731003237" role="button">Сообщить о проблеме</a>
        </div>
        <div class="burger">
            <span></span>
        </div>
    </header>

    <div class="container">
        <header>
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-car-crash"></i>
                    <h1>ДТП Смоленск</h1>
                </div>
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">Все</button>
                    <button class="filter-btn" data-filter="today">Сегодня</button>
                    <button class="filter-btn" data-filter="serious">Серьёзные</button>
                    <button class="filter-btn" data-filter="center">Центр</button>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div class="map-container">
                <div id="map"></div>
                <div class="map-controls">
                    <button class="control-btn" id="zoom-in"><i class="fas fa-plus"></i></button>
                    <button class="control-btn" id="zoom-out"><i class="fas fa-minus"></i></button>
                    <button class="control-btn" id="current-location"><i class="fas fa-location-arrow"></i></button>
                    <button class="control-btn" id="reset-view"><i class="fas fa-globe"></i></button>
                </div>
            </div>

            <div class="sidebar">
                <div class="sidebar-header">
                    <h2><i class="fas fa-list"></i> Происшествия</h2>
                    <div class="last-update">Обновлено: <span id="update-time">только что</span></div>
                </div>
                <div class="incident-list" id="incident-list">
                    <!-- Список будет заполнен через JavaScript -->
                </div>

                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="total-accidents">0</div>
                        <div class="stat-label">Всего ДТП</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="today-accidents">0</div>
                        <div class="stat-label">Сегодня</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="serious-accidents">0</div>
                        <div class="stat-label">Серьёзные</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

 <script>
     document.querySelector('.burger').addEventListener('click', function() {
         this.classList.toggle('active');
         document.querySelector('.menu').classList.toggle('open');
     })
 </script>

<script src="map.js"></script>
</body>
</html>
